name: Generate a build and push to another branch

on:
  push:
    branches:
      - main # La rama donde haces commit de los nuevos cambios

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # El comando de build de tu proyecto

      - name: Push to build branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build # Rama donde se subirán los archivos generados
          FOLDER: dist  # Carpeta donde se genera el build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
